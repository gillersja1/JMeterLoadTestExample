name: JMeter Load Test

on:
  workflow_dispatch:
    inputs:
      threads:
        description: 'Number of concurrent virtual users'
        required: false
        default: '20'
      rampup:
        description: 'Ramp-up period in seconds'
        required: false
        default: '10'
      loops:
        description: 'Loop count per user'
        required: false
        default: '5'
  push:
    branches: [main]
    paths:
      - 'test-plans/**'
      - 'mock-api/**'
      - '.github/workflows/load-test.yml'
  pull_request:
    paths:
      - 'test-plans/**'
      - 'mock-api/**'
      - '.github/workflows/load-test.yml'

env:
  JMETER_VERSION: 5.6.3

jobs:
  load-test:
    name: Run JMeter Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache JMeter
        id: cache-jmeter
        uses: actions/cache@v4
        with:
          path: apache-jmeter-${{ env.JMETER_VERSION }}
          key: jmeter-${{ env.JMETER_VERSION }}

      - name: Download JMeter
        if: steps.cache-jmeter.outputs.cache-hit != 'true'
        run: |
          wget -q "https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz"
          tar -xzf "apache-jmeter-${JMETER_VERSION}.tgz"

      # The target runs inside the job: reqres.in's free tier allows only
      # 20 requests/minute, so it can't take a real load test.
      - name: Start mock API
        run: |
          node mock-api/server.js 8080 &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && exit 0; sleep 1; done
          echo "::error::Mock API did not start"; exit 1

      - name: Run load test
        run: |
          mkdir -p results reports
          ./apache-jmeter-${JMETER_VERSION}/bin/jmeter -n \
            -t test-plans/reqres-api-load-test.jmx \
            -l results/results.jtl \
            -e -o reports/html-report \
            -Jhost=localhost -Jprotocol=http -Jport=8080 \
            -Jthreads="${{ github.event.inputs.threads || '20' }}" \
            -Jrampup="${{ github.event.inputs.rampup || '10' }}" \
            -Jloops="${{ github.event.inputs.loops || '5' }}"

      # Same pass/fail criteria as AzureLoadTestingExample's failureCriteria.
      # JMeter's dashboard reports pct2ResTime as the 95th percentile by default.
      - name: Check performance thresholds
        run: |
          stats=reports/html-report/statistics.json
          avg=$(jq '.Total.meanResTime' "$stats")
          p95=$(jq '.Total.pct2ResTime' "$stats")
          err=$(jq '.Total.errorPct' "$stats")
          echo "| Metric | Value | Limit |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Avg response time | ${avg} ms | 1000 ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| p95 response time | ${p95} ms | 2000 ms |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Error rate | ${err}% | 10% |" >> "$GITHUB_STEP_SUMMARY"
          jq -e '.Total.meanResTime <= 1000 and .Total.pct2ResTime <= 2000 and .Total.errorPct <= 10' "$stats" > /dev/null \
            || { echo "::error::Performance thresholds breached (avg=${avg}ms p95=${p95}ms errors=${err}%)"; exit 1; }

      - name: Upload raw results (.jtl)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/

      - name: Upload HTML dashboard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report
          path: reports/html-report
